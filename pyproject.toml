[project]
name = "unibo-toolkit"
version = "0.4.0.dev20261007152159"
description = "Python toolkit for scraping and accessing University of Bologna data"
authors = [
    {name = "Vadym Teliatnyk", email = "vadym.teliatnyk@komo4ek.me"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "beautifulsoup4>=4.9.0,<5.0.0",
    "aiohttp>=3.14.5,<4.0.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.0.0,<2.0.0"
]

[dependency-groups]
dev = [
    "black[d]>=26.10.0,<27.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "mypy>=1.0.0,<2.0.0"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests/research
  | \.github
)/
'''

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
